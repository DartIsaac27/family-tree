<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#8a5a44" />
<title>Peta Pokok Fatimah</title>
<script>
(function () {
  var theme = null;
  try { theme = localStorage.getItem('familyTreeTheme'); } catch (e) {}
  if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<link rel="stylesheet" href="https://unpkg.com/cropperjs@1/dist/cropper.min.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="appbar">
    <button type="button" id="backBtn" class="icon-btn appbar-back hidden" data-i18n-label="common.back"></button>
    <div class="appbar-title">
      <span class="brand-mark" aria-hidden="true">🌳</span>
      <h1 id="pageTitle"></h1>
    </div>
    <div class="appbar-actions">
      <button type="button" id="searchBtn" class="icon-btn" data-i18n-label="common.search"></button>
      <button type="button" id="langBtn" class="lang-btn" aria-label="Bahasa / Language"></button>
    </div>
  </header>

  <main id="views">
    <section class="view" id="view-home" data-view="home"></section>
    <section class="view view-fixed" id="view-tree" data-view="tree"></section>
    <section class="view view-fixed" id="view-map" data-view="map"></section>
    <section class="view" id="view-memories" data-view="memories"></section>
    <section class="view" id="view-album" data-view="album"></section>
    <section class="view" id="view-relation" data-view="relation"></section>
    <section class="view" id="view-more" data-view="more"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <a href="#/" data-tab="home"><span class="tab-ic" data-icon="home"></span><span data-i18n="tab.home"></span></a>
    <a href="#/tree" data-tab="tree"><span class="tab-ic" data-icon="tree"></span><span data-i18n="tab.tree"></span></a>
    <a href="#/map" data-tab="map"><span class="tab-ic" data-icon="map"></span><span data-i18n="tab.map"></span></a>
    <a href="#/memories" data-tab="memories"><span class="tab-ic" data-icon="image"></span><span data-i18n="tab.memories"></span></a>
    <a href="#/more" data-tab="more"><span class="tab-ic" data-icon="menu"></span><span data-i18n="tab.more"></span></a>
  </nav>

  <div id="overlayRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/cropperjs@1/dist/cropper.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/names.js"></script>
  <script src="js/family.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/person.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/map.js"></script>
  <script src="js/memories.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
